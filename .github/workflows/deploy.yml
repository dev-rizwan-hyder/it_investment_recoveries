name: Deploy to Hostinger (CI/CD)

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, bcmath, curl, zip
          coverage: none

      - name: 📦 Install Composer dependencies
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🎨 Build Frontend Assets (Vite)
        run: |
          npm install || true
          npm run build || true

      - name: 🚀 Deploy to Hostinger via SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: "194.164.64.189"
          REMOTE_PORT: "65002"
          REMOTE_USER: "u229482509"
          TARGET_DIR: "domains/it-investmentrecoveries.com/public_html"
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::error::SSH_PRIVATE_KEY secret is missing! Please add it in GitHub Settings -> Secrets -> Actions."
            exit 1
          fi

          mkdir -p ~/.ssh
          echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p $REMOTE_PORT $REMOTE_HOST >> ~/.ssh/known_hosts 2>/dev/null

          echo "Deploying files via Rsync..."
          rsync -avz -e "ssh -p $REMOTE_PORT -o StrictHostKeyChecking=no" \
            --exclude='.git*' \
            --exclude='.github' \
            --exclude='.idea' \
            --exclude='.vscode' \
            --exclude='tests' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='node_modules' \
            --exclude='storage/logs/*' \
            --exclude='storage/framework/cache/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            --exclude='README.md' \
            ./ $REMOTE_USER@$REMOTE_HOST:~/$TARGET_DIR/ || \
          rsync -avz -e "ssh -p $REMOTE_PORT -o StrictHostKeyChecking=no" \
            --exclude='.git*' \
            --exclude='.github' \
            --exclude='.idea' \
            --exclude='.vscode' \
            --exclude='tests' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='node_modules' \
            --exclude='storage/logs/*' \
            --exclude='storage/framework/cache/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            --exclude='README.md' \
            ./ $REMOTE_USER@$REMOTE_HOST:~/public_html/

          echo "Running Laravel commands on Hostinger..."
          ssh -p $REMOTE_PORT -o StrictHostKeyChecking=no $REMOTE_USER@$REMOTE_HOST "cd ~/$TARGET_DIR 2>/dev/null || cd ~/public_html; php artisan optimize:clear; php artisan config:cache; php artisan route:cache; php artisan view:cache" || true
          echo "Deployment completed successfully via SSH!"
